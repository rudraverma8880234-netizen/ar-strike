<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AR Strike</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f0a">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg: #0b0f0a;
    --panel: rgba(11,15,10,0.72);
    --line: #4a5248;
    --text: #e8ece6;
    --lock: #39ff6a;
    --fire: #ff4433;
    --amber: #ffaa00;
    --mono: 'Courier New', ui-monospace, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); overflow: hidden;
    font-family: var(--mono);
    color: var(--text);
  }
  #stage {
    position: fixed; inset: 0;
    overflow: hidden;
  }
  #cam, #overlay {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #cam { background: #000; }
  #overlay { pointer-events: none; }

  /* Permission / loading screen */
  #gate {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: var(--bg); text-align: center; padding: 32px;
  }
  #gate h1 {
    font-size: 22px; letter-spacing: 2px; margin: 0; color: var(--lock);
  }
  #gate p { color: var(--line); font-size: 13px; line-height: 1.6; max-width: 320px; margin: 0; }
  #startBtn {
    margin-top: 10px; padding: 14px 34px; font-size: 15px; letter-spacing: 1px;
    background: transparent; color: var(--lock); border: 2px solid var(--lock);
    border-radius: 4px; font-family: var(--mono); font-weight: bold;
  }
  #startBtn:active { background: var(--lock); color: #0b0f0a; }
  #gateStatus { font-size: 12px; color: var(--amber); min-height: 16px; }

  /* Top HUD */
  #topHud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    padding: max(14px, env(safe-area-inset-top)) 16px 10px 16px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
    display: flex; flex-direction: column; gap: 6px;
  }
  .hpRow { display: flex; align-items: center; gap: 10px; }
  .hpLabel { font-size: 11px; letter-spacing: 2px; color: var(--line); width: 56px; }
  .hpTrack {
    flex: 1; height: 14px; background: rgba(255,255,255,0.08);
    border: 1px solid var(--line); border-radius: 2px; overflow: hidden;
  }
  .hpFill { height: 100%; width: 100%; background: var(--lock); transition: width 0.25s ease; }
  .hpNum { font-size: 13px; width: 46px; text-align: right; }
  #statusLine { font-size: 11px; color: var(--amber); letter-spacing: 1px; height: 14px; }

  /* Reticle */
  #reticle {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 64px; height: 64px; z-index: 15; pointer-events: none;
  }
  #reticle svg { width: 100%; height: 100%; display: block; }
  #reticle .ring { stroke: var(--text); }
  #reticle.locked .ring { stroke: var(--lock); }
  #reticle .tick { stroke: var(--text); }
  #reticle.locked .tick { stroke: var(--lock); }
  #lockText {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, 24px);
    font-size: 11px; letter-spacing: 3px; color: var(--lock); opacity: 0;
    z-index: 15; transition: opacity 0.15s;
  }
  #lockText.show { opacity: 1; }

  /* Hit marker */
  #hitFlash {
    position: fixed; inset: 0; z-index: 12; pointer-events: none;
    background: rgba(255,68,51,0); transition: background 0.08s;
  }
  .popup {
    position: fixed; z-index: 25; font-size: 15px; font-weight: bold; color: var(--fire);
    pointer-events: none; animation: floatUp 0.7s ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -46px); }
  }

  /* Bottom HUD */
  #bottomHud {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    padding: 18px 22px max(22px, env(safe-area-inset-bottom)) 22px;
    display: flex; align-items: flex-end; justify-content: space-between;
    background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
  }
  .ammoBox { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .ammoLabel { font-size: 10px; letter-spacing: 2px; color: var(--line); }
  .ammoNum { font-size: 20px; color: var(--text); }
  #reloadBtn, #fireBtn {
    border-radius: 50%; border: 3px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-weight: bold; letter-spacing: 1px;
    background: var(--panel); color: var(--text);
  }
  #reloadBtn { width: 62px; height: 62px; font-size: 10px; border-color: var(--amber); color: var(--amber); }
  #reloadBtn:active { background: var(--amber); color: #0b0f0a; }
  #fireBtn { width: 86px; height: 86px; font-size: 13px; border-color: var(--fire); color: var(--fire); }
  #fireBtn:active { background: var(--fire); color: #0b0f0a; transform: scale(0.94); }
  #fireBtn.disabled, #reloadBtn.disabled { opacity: 0.35; }

  #downOverlay {
    position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.82);
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  }
  #downOverlay.show { display: flex; }
  #downOverlay h2 { color: var(--fire); font-size: 24px; letter-spacing: 3px; margin: 0; }
  #respawnBtn {
    padding: 12px 28px; background: transparent; border: 2px solid var(--lock);
    color: var(--lock); font-family: var(--mono); font-size: 14px; letter-spacing: 1px; border-radius: 4px;
  }
</style>
</head>
<body>

<div id="gate">
  <h1>AR STRIKE</h1>
  <p>Back camera se real duniya me kisi insaan ko aim karo — white ring lock hote hi FIRE dabao. Har hit 10 damage, health 200 se shuru.</p>
  <button id="startBtn">CAMERA SHURU KARO</button>
  <div id="gateStatus"></div>
</div>

<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<div id="topHud">
  <div class="hpRow">
    <div class="hpLabel">TARGET</div>
    <div class="hpTrack"><div class="hpFill" id="hpFill"></div></div>
    <div class="hpNum" id="hpNum">200</div>
  </div>
  <div id="statusLine">SCANNING...</div>
</div>

<div id="hitFlash"></div>
<div id="reticle">
  <svg viewBox="0 0 64 64">
    <circle class="ring" cx="32" cy="32" r="16" fill="none" stroke-width="2"/>
    <line class="tick" x1="32" y1="2" x2="32" y2="12" stroke-width="2"/>
    <line class="tick" x1="32" y1="52" x2="32" y2="62" stroke-width="2"/>
    <line class="tick" x1="2" y1="32" x2="12" y2="32" stroke-width="2"/>
    <line class="tick" x1="52" y1="32" x2="62" y2="32" stroke-width="2"/>
  </svg>
</div>
<div id="lockText">LOCKED</div>

<div id="bottomHud">
  <button id="reloadBtn">RELOAD</button>
  <div class="ammoBox">
    <div class="ammoLabel">AMMO</div>
    <div class="ammoNum" id="ammoNum">6/6</div>
  </div>
  <button id="fireBtn">FIRE</button>
</div>

<div id="downOverlay">
  <h2>TARGET ELIMINATED</h2>
  <button id="respawnBtn">NAYA TARGET</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
